<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Assignment</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="logo">
                ✦
            </div>

            <h1>Room Assignment</h1>

            <p class="subtitle">
                Enter your team name to find your room.
            </p>

            <form id="roomForm">

                <label for="teamName">
                    Team Name
                </label>

                <input
                    type="text"
                    id="teamName"
                    placeholder="Enter your team name"
                    maxlength="100"
                    autocomplete="off"
                    required
                >

                <button type="submit" id="assignButton">
                    Assign My Room
                </button>

            </form>

            <p id="errorMessage" class="error"></p>

        </div>

    </main>

    <script src="/script.js"></script>

</body>

</html>
